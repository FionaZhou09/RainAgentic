[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# record() carries eight parameters plus locals; without the IR pipeline solc runs out of
# stack slots. Also what we want for a deployed contract.
optimizer = true
optimizer_runs = 200
via_ir = true
# Read-only access to WP2's cross-language digest vector. The Solidity side must
# reproduce a digest TypeScript computed yesterday; regenerating it here would make
# the pin tautological.
fs_permissions = [{ access = "read", path = "../lib/mandate/__fixtures__" }]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_testnet_backup1 = "https://rpc-testnet.monadinfra.com"
monad_testnet_backup2 = "https://rpc.ankr.com/monad_testnet"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
